version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql # Persist data

  discovery-server: # Replace with your discovery server
    image: eurekaserverimage # Replace with your discovery server image name (e.g., springcloud/eureka)
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server
    environment:
      eureka.client.service-url.defaultZone: http://discovery-server:8761/eureka

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb
      eureka.client.service-url.defaultZone: http://discovery-server:8761/eureka
    depends_on:
      - mysql
      - discovery-server

  core-service:
    build: ./core-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb
      eureka.client.service-url.defaultZone: http://discovery-server:8761/eureka
    depends_on:
      - mysql
      - discovery-server

  engine-service:
    build: ./engine-service
    ports:
      - "8083:8083"
    environment:
      eureka.client.service-url.defaultZone: http://discovery-server:8761/eureka
    depends_on:
      - discovery-server

volumes:
  mysql-data: # define the volume