<div class="accordion">
    <div class="accordion-item" *ngFor="let item of items; let i = index" [class.open]="openIndex === i">
        <div class="accordion-header" (click)="toggle(i)">
            <h6 class="mb-0">{{ item.title }}</h6>
            <span class="icon">
                <i [class]="
              openIndex === i ? 'fas fa-chevron-up' : 'fas fa-chevron-down'
            "></i>
            </span>
        </div>
        <div class="accordion-body" *ngIf="openIndex === i">
            <p class="mb-0">{{ item.content }}</p>
        </div>
    </div>
</div>
