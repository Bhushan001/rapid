<div class="table-container">
    <table class="table table-bordered">
        <thead>
            <tr>
                <th *ngFor="let column of columns">{{ column.header }}</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let row of data">
                <td *ngFor="let column of columns">
                    {{ row[column.field] }}
                </td>
            </tr>
        </tbody>
    </table>
</div>
