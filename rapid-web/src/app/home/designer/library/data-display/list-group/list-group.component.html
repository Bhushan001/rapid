<div class="list-group">
    <a *ngFor="let item of items" href="javascript:void(0)" class="list-group-item list-group-item-action"
        (click)="onItemClick(item)">
        {{ item.label }}
        <span *ngIf="showAction" class="action-label">{{ item.actionLabel || 'Action' }}</span>
    </a>
</div>
