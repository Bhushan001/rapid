<div class="login-block">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <h3 class="text-center mb-4">Login</h3>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" formControlName="email" class="form-control"
                [class.is-invalid]="submitted && f['email'].errors" placeholder="Enter email" />
            <div class="invalid-feedback" *ngIf="submitted && f['email'].errors">
                <span *ngIf="f['email'].errors['required']">Email is required.</span>
                <span *ngIf="f['email'].errors['email']">Enter a valid email.</span>
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" formControlName="password" class="form-control"
                [class.is-invalid]="submitted && f['password'].errors" placeholder="Enter password" />
            <div class="invalid-feedback" *ngIf="submitted && f['password'].errors">
                <span *ngIf="f['password'].errors['required']">Password is required.</span>
                <span *ngIf="f['password'].errors['minlength']">Minimum 6 characters.</span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
</div>
