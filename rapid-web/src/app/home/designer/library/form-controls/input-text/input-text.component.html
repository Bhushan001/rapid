<div class="form-group">
    <label *ngIf="label" [for]="name" class="form-label">
        {{ label }} <span *ngIf="required" class="text-danger">*</span>
    </label>
    <input type="text" class="form-control" [id]="name" [name]="name" [placeholder]="placeholder" [value]="value"
        [disabled]="disabled" (input)="onInputChange($event)" />
</div>
