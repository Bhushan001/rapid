<div class="entity-section">
  <div class="entity-header d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center">
      <i class="bx bx-folder-open fs-3 me-2 text-primary"></i>
      <h5 class="mb-0 fw-bold">Projects</h5>
    </div>
  </div>

  <div *ngFor="let project of paginatedProjects" class="entity-card p-2 mb-2 border rounded bg-light">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <strong>{{ project.name }}</strong>
        <div class="small">{{ project.description }}</div>
        <div class="small text-secondary">Created: {{ project.createdDate }}</div>
      </div>
      <div class="d-flex align-items-center">
        <i class="bx bx-edit-alt me-2 text-primary"></i>
        <i class="bx bx-trash me-2 text-danger"></i>
        <i class="bx bx-show text-secondary"></i>
      </div>
    </div>
  </div>

  <nav *ngIf="totalPages > 1">
    <ul class="pagination pagination-sm justify-content-center mt-3">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(currentPage - 1)">‹</button>
      </li>
      <li class="page-item" *ngFor="let page of pagesArray" [class.active]="page === currentPage">
        <button class="page-link" (click)="changePage(page)">{{ page }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="changePage(currentPage + 1)">›</button>
      </li>
    </ul>
  </nav>
</div>
